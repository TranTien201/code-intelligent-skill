<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge Review</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1f2328; --muted: #656d76;
  --del-bg: #ffebe9; --del-strong: #ffcecb; --del-text: #82071e;
  --add-bg: #dafbe1; --add-strong: #aceebb; --add-text: #116329;
  --exist-bg: #ddf4ff; --fill: #eef0f3; --fill-line: #dde1e6;
  --warn: #9a6700; --warn-bg: #fff8c5; --accent: #0969da; --hdr-bg: #f0f3f6;
  --badge-merged: #1a7f37; --badge-new: #8250df; --badge-confirm: #bc4c00; --badge-skip: #57606a; --badge-del: #cf222e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
    --del-bg: #3c1618; --del-strong: #6e1f22; --del-text: #ffa198;
    --add-bg: #12261e; --add-strong: #1f4a2c; --add-text: #7ee787;
    --exist-bg: #0c2d4a; --fill: #1c2128; --fill-line: #262c34;
    --warn: #d29922; --warn-bg: #2e2510; --accent: #4493f8; --hdr-bg: #1c2128;
    --badge-merged: #3fb950; --badge-new: #a371f7; --badge-confirm: #f0883e; --badge-skip: #8d96a0; --badge-del: #f85149;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
  --del-bg: #3c1618; --del-strong: #6e1f22; --del-text: #ffa198;
  --add-bg: #12261e; --add-strong: #1f4a2c; --add-text: #7ee787;
  --exist-bg: #0c2d4a; --fill: #1c2128; --fill-line: #262c34;
  --warn: #d29922; --warn-bg: #2e2510; --accent: #4493f8; --hdr-bg: #1c2128;
  --badge-merged: #3fb950; --badge-new: #a371f7; --badge-confirm: #f0883e; --badge-skip: #8d96a0; --badge-del: #f85149;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--border); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
aside h1 { font-size: 15px; margin: 0; padding: 14px 16px 4px; }
aside .sub { color: var(--muted); font-size: 12px; padding: 0 16px 12px; border-bottom: 1px solid var(--border); }
.filelist { list-style: none; margin: 0; padding: 6px; }
.filelist li { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; }
.filelist li:hover { background: var(--hdr-bg); }
.filelist li.active { background: var(--exist-bg); }
.filelist .fp { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.filelist .tp { color: var(--muted); font-size: 11px; font-family: var(--mono); word-break: break-all; }
.counts { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.pill { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--border); white-space: nowrap; }
.pill.pending { color: var(--badge-confirm); border-color: var(--badge-confirm); }
.pill.ok { color: var(--badge-merged); border-color: var(--badge-merged); }
.issues { padding: 10px 16px; border-top: 1px solid var(--border); margin-top: auto; }
.issues h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 8px; }
.issue { font-size: 12.5px; margin-bottom: 8px; padding: 6px 8px; border-left: 3px solid var(--badge-confirm); background: var(--hdr-bg); border-radius: 0 4px 4px 0; }
.issue.WARNING { border-left-color: var(--warn); }
.issue b { display: block; }
main { overflow: auto; display: flex; flex-direction: column; }
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .title { font-family: var(--mono); font-weight: 600; margin-right: auto; word-break: break-all; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 4px 10px; }
.btn:hover { background: var(--hdr-bg); }
.btn.primary { background: var(--badge-merged); border-color: var(--badge-merged); color: #fff; }
.btn.primary:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; }
.seg button.on { background: var(--accent); color: #fff; }
.banner { margin: 12px 16px 0; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.banner.ok { background: var(--add-bg); color: var(--add-text); border: 1px solid var(--badge-merged); }
.banner a { color: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; margin-right: 8px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 8px 16px 0; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -2px; border: 1px solid var(--border); }
.legend .l-del::before { background: var(--del-bg); } .legend .l-add::before { background: var(--add-bg); }
.legend .l-fill::before { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 3px, var(--fill-line) 3px, var(--fill-line) 6px); }
.legend .l-exist::before { background: var(--exist-bg); }
.view { margin: 12px 16px 40px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
.colhdr, .row { display: grid; grid-template-columns: 44px minmax(0,1fr) 36px 44px minmax(0,1fr); }
.colhdr { background: var(--hdr-bg); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; position: sticky; top: 0; }
.colhdr div { padding: 6px 8px; }
.row { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
.row .ln { color: var(--muted); text-align: right; padding: 0 6px; user-select: none; font-size: 11.5px; }
.row .code { white-space: pre-wrap; word-break: break-all; padding: 0 8px; min-height: 1.5em; }
.row .gut { display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--hdr-bg); }
.row .ctx { color: var(--text); }
.row .dim { color: var(--muted); }
.c-del { background: var(--del-bg); } .c-del.ln { background: var(--del-strong); }
.c-add { background: var(--add-bg); } .c-add.ln { background: var(--add-strong); }
.c-exist { background: var(--exist-bg); }
.c-fill { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 4px, var(--fill-line) 4px, var(--fill-line) 8px); }
.c-del.struck { text-decoration: line-through; text-decoration-color: var(--del-text); opacity: .75; }
.arrow { border: 1px solid var(--border); background: var(--panel); border-radius: 50%; width: 26px; height: 26px; line-height: 1; padding: 0; font-size: 14px; }
.arrow.on { background: var(--badge-merged); border-color: var(--badge-merged); color: #fff; }
.arrow.pending { border-color: var(--badge-confirm); color: var(--badge-confirm); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--badge-confirm) 25%, transparent); } }
.hhdr { grid-column: 1 / -1; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--hdr-bg); padding: 6px 10px; font-family: system-ui, sans-serif; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.hhdr.NEED_CONFIRM { background: var(--warn-bg); }
.hhdr .unit { font-family: var(--mono); font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; color: #fff; }
.b-MERGED, .b-MERGED_DEP { background: var(--badge-merged); } .b-MERGED_NEW { background: var(--badge-new); }
.b-NEED_CONFIRM { background: var(--badge-confirm); } .b-SKIP_EXISTS, .b-SKIP_NOT_IN_TARGET { background: var(--badge-skip); }
.b-DELETED { background: var(--badge-del); }
.b-match { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.hhdr .note { color: var(--muted); flex-basis: 100%; }
.hhdr .q { flex-basis: 100%; font-weight: 600; color: var(--warn); }
.hhdr .state { margin-left: auto; font-size: 12px; }
.hhdr textarea { flex-basis: 100%; min-height: 34px; font: 12.5px system-ui, sans-serif; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); resize: vertical; }
.gap { grid-column: 1 / -1; text-align: center; font-family: system-ui, sans-serif; font-size: 12px; color: var(--accent); background: var(--hdr-bg); border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); padding: 3px; cursor: pointer; }
.unplaced-title { grid-column: 1 / -1; padding: 10px; font-family: system-ui, sans-serif; font-weight: 600; border-top: 2px solid var(--badge-confirm); }
.noplace { grid-column: 4 / 6; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 12px; color: var(--badge-confirm); background: var(--fill); padding: 6px; text-align: center; }
.result .row { grid-template-columns: 54px minmax(0,1fr); }
.result .colhdr { grid-template-columns: 1fr; }
.flash { outline: 2px solid var(--badge-confirm); outline-offset: -2px; }
.empty { padding: 30px; text-align: center; color: var(--muted); font-family: system-ui, sans-serif; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
  .colhdr, .row { grid-template-columns: 30px minmax(0,1fr) 30px 30px minmax(0,1fr); }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1 id="rt"></h1>
    <div class="sub" id="subtitle"></div>
    <ul class="filelist" id="filelist"></ul>
    <div class="issues" id="globalIssues"></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="title" id="fileTitle"></span>
      <div class="seg" id="viewSeg">
        <button data-v="diff" class="on">Thay đổi</button><button data-v="result">Kết quả</button>
      </div>
      <button class="btn" id="nextPending">Mục cần xác nhận tiếp ↓</button>
      <button class="btn" id="dlDecisions">Tải decisions.json</button>
      <button class="btn primary" id="confirm">Xác nhận &amp; tạo kết quả</button>
    </div>
    <div id="banners"></div>
    <div class="legend">
      <span class="l-del">Vùng đã detect (dòng - / block FOMULAR bị thay)</span>
      <span class="l-add">Code feature (+)</span>
      <span class="l-fill">Chỗ trống: chưa lấy thay đổi</span>
      <span class="l-exist">FOMULAR đã có sẵn</span>
    </div>
    <div id="content"></div>
  </main>
</div>
<script type="application/json" id="view-data">/*__VIEW_DATA__*/null</script>
<script>
// CORE-BEGIN — logic thuần, giữ giống merge_ui.py (test bằng node)
const TOGGLE = new Set(['MERGED', 'MERGED_NEW', 'MERGED_DEP', 'DELETED', 'NEED_CONFIRM']);
function hunkKind(h) {
  if (!h.target) return 'unplaced';
  if ('after' in h.target) return 'insert';
  if (!h.plus.length) return 'delete';
  return 'replace';
}
function isToggleable(h) { return !!h.target && TOGGLE.has(h.result); }
function defaultDecision(h) {
  if (!isToggleable(h)) return null;
  return h.result === 'NEED_CONFIRM' ? 'pending' : 'accept';
}
function posKey(h) { const t = h.target; return ('after' in t) ? t.after + 0.5 : t.start; }
// Trả về [{text, origin: 'target'|'feature', tline?, hunk?}]
function applyFile(file, dec) {
  const out = file.target_lines.map((t, i) => ({ text: t, origin: 'target', tline: i + 1 }));
  const edits = file.hunks.map((h, i) => ({ h, i })).filter(x => isToggleable(x.h) && dec[x.h.id] === 'accept');
  edits.sort((a, b) => (posKey(b.h) - posKey(a.h)) || (b.i - a.i));
  for (const { h } of edits) {
    const t = h.target;
    const ins = h.plus.map(x => ({ text: x, origin: 'feature', hunk: h.id }));
    if ('after' in t) out.splice(t.after, 0, ...ins);
    else out.splice(t.start - 1, t.end - t.start + 1, ...ins);
  }
  return out;
}
// Trình tự hiển thị theo dòng Target: {type:'line', tline} | {type:'hunk', h}
function layout(file) {
  const starts = new Map(), inserts = new Map();
  for (const h of file.hunks) {
    if (!h.target) continue;
    if ('after' in h.target) {
      if (!inserts.has(h.target.after)) inserts.set(h.target.after, []);
      inserts.get(h.target.after).push(h);
    } else starts.set(h.target.start, h);
  }
  const items = [];
  const pushIns = k => (inserts.get(k) || []).forEach(h => items.push({ type: 'hunk', h }));
  pushIns(0);
  const N = file.target_lines.length;
  let i = 1;
  while (i <= N) {
    const h = starts.get(i);
    if (h) { items.push({ type: 'hunk', h }); pushIns(h.target.end); i = h.target.end + 1; }
    else { items.push({ type: 'line', tline: i }); pushIns(i); i++; }
  }
  return items;
}
// CORE-END

if (typeof document !== 'undefined') {
const VIEW = JSON.parse(document.getElementById('view-data').textContent);
const CTX = 3;
const STORE_KEY = `merge-ui:${VIEW.rt}:${VIEW.signature}`;
const state = { fileIdx: 0, view: 'diff', confirmed: false, decisions: {}, answers: {}, expanded: new Set() };

for (const f of VIEW.files) {
  state.decisions[f.path] = {};
  state.answers[f.path] = {};
  for (const h of f.hunks) { const d = defaultDecision(h); if (d) state.decisions[f.path][h.id] = d; }
}
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved) {
    for (const p in saved.decisions || {}) if (state.decisions[p]) for (const id in saved.decisions[p]) if (id in state.decisions[p]) state.decisions[p][id] = saved.decisions[p][id];
    for (const p in saved.answers || {}) if (state.answers[p]) Object.assign(state.answers[p], saved.answers[p]);
  }
} catch (e) { /* bỏ qua */ }
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ decisions: state.decisions, answers: state.answers })); } catch (e) { /* bỏ qua */ }
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const curFile = () => VIEW.files[state.fileIdx];

function fileCounts(f) {
  const d = state.decisions[f.path];
  let pending = 0, accepted = 0, unplaced = 0;
  for (const h of f.hunks) {
    if (d[h.id] === 'pending') pending++;
    if (d[h.id] === 'accept') accepted++;
    if (!h.target && h.result === 'NEED_CONFIRM') unplaced++;
  }
  return { pending, accepted, unplaced };
}
function allPending() {
  const out = [];
  VIEW.files.forEach((f, fi) => f.hunks.forEach(h => { if (state.decisions[f.path][h.id] === 'pending') out.push({ fi, h }); }));
  return out;
}

function renderSidebar() {
  $('rt').textContent = VIEW.rt;
  $('subtitle').textContent = VIEW.title || '';
  $('filelist').innerHTML = VIEW.files.map((f, i) => {
    const c = fileCounts(f);
    return `<li data-i="${i}" class="${i === state.fileIdx ? 'active' : ''}">
      <div class="fp">${esc(f.path)}</div>
      ${f.telindy_path ? `<div class="tp">← ${esc(f.telindy_path)}</div>` : ''}
      <div class="counts">
        <span class="pill ok">${c.accepted} lấy</span>
        ${c.pending ? `<span class="pill pending">${c.pending} cần xác nhận</span>` : ''}
        ${c.unplaced ? `<span class="pill pending">${c.unplaced} sửa tay</span>` : ''}
        ${f.target_missing ? '<span class="pill">file mới</span>' : ''}
      </div></li>`;
  }).join('');
  const gi = VIEW.issues || [];
  const val = VIEW.validation || { errors: [], warnings: [] };
  $('globalIssues').innerHTML = (gi.length || val.errors.length || val.warnings.length) ? `<h2>Vấn đề chung</h2>` +
    gi.map(x => `<div class="issue ${esc(x.level)}"><b>${esc(x.title)}</b>${esc(x.detail || '')}</div>`).join('') +
    val.errors.map(x => `<div class="issue"><b>Lỗi dữ liệu</b>${esc(x)}</div>`).join('') +
    val.warnings.map(x => `<div class="issue WARNING"><b>Kiểm tra dữ liệu</b>${esc(x)}</div>`).join('') : '';
}

function row(l, lc, lt, gut, r, rc, rt) {
  return `<div class="row"><div class="ln ${lc}">${l}</div><div class="code ${lc}">${lt}</div><div class="gut">${gut}</div><div class="ln ${rc}">${r}</div><div class="code ${rc}">${rt}</div></div>`;
}

function hunkHeader(f, h) {
  const d = state.decisions[f.path][h.id];
  const parts = [`<span class="unit">${esc(h.unit)}</span>`];
  if (h.hunk) parts.push(`<span>hunk ${esc(h.hunk)}</span>`);
  if (h.section) parts.push(`<span class="badge b-match">${esc(h.section)}</span>`);
  parts.push(`<span class="badge b-${esc(h.result)}">${esc(h.result)}</span>`);
  if (h.match) parts.push(`<span class="badge b-match">${esc(h.match)}</span>`);
  if (h.before_range) parts.push(`<span style="color:var(--muted)">Before: ${esc(h.before_range)}</span>`);
  if (isToggleable(h)) {
    parts.push(`<span class="state">${d === 'accept' ? 'Lấy thay đổi feature' : d === 'reject' ? 'Giữ FOMULAR' : '<b style="color:var(--badge-confirm)">Chưa quyết định</b>'}</span>`);
    parts.push(`<span class="seg"><button data-act="accept" data-id="${esc(h.id)}" class="${d === 'accept' ? 'on' : ''}">Lấy feature</button><button data-act="reject" data-id="${esc(h.id)}" class="${d === 'reject' ? 'on' : ''}">Giữ FOMULAR</button></span>`);
  }
  if (h.note) parts.push(`<span class="note">${esc(h.note)}</span>`);
  if (h.question) parts.push(`<span class="q">❓ ${esc(h.question)}</span>`);
  if (h.result === 'NEED_CONFIRM') {
    parts.push(`<textarea data-ans="${esc(h.id)}" placeholder="Trả lời / ghi chú cho mục này (ghi vào decisions.json)">${esc(state.answers[f.path][h.id] || '')}</textarea>`);
  }
  return `<div class="row" id="h-${esc(f.path)}-${esc(h.id)}"><div class="hhdr ${esc(h.result)}">${parts.join('')}</div></div>`;
}

function arrowBtn(f, h) {
  if (!isToggleable(h)) return '';
  const d = state.decisions[f.path][h.id];
  if (d === 'accept') return `<button class="arrow on" data-toggle="${esc(h.id)}" title="Đang lấy thay đổi. Bấm để giữ FOMULAR">✓</button>`;
  return `<button class="arrow ${d === 'pending' ? 'pending' : ''}" data-toggle="${esc(h.id)}" title="Bấm để lấy thay đổi feature sang FOMULAR">→</button>`;
}

function renderHunk(f, h) {
  const d = state.decisions[f.path][h.id];
  const acc = d === 'accept';
  const kind = hunkKind(h);
  let html = hunkHeader(f, h);
  const T = f.target_lines;
  if (h.result === 'SKIP_EXISTS' && h.target && !('after' in h.target)) {
    const blk = T.slice(h.target.start - 1, h.target.end);
    const n = Math.max(h.plus.length, blk.length);
    for (let i = 0; i < n; i++) {
      html += row(i < h.plus.length ? '+' : '', i < h.plus.length ? 'c-add' : 'c-fill', esc(h.plus[i] ?? ''), '',
        i < blk.length ? h.target.start + i : '', i < blk.length ? 'c-exist' : 'c-fill', esc(blk[i] ?? ''));
    }
    return html;
  }
  let arrowUsed = false;
  const gut = () => { if (arrowUsed) return ''; arrowUsed = true; return arrowBtn(f, h); };
  if (kind === 'replace' || kind === 'delete') {
    const blk = T.slice(h.target.start - 1, h.target.end);
    const n = Math.max(h.minus.length, blk.length);
    for (let i = 0; i < n; i++) {
      const hasL = i < h.minus.length, hasR = i < blk.length;
      html += row(hasL ? '−' : '', hasL ? 'c-del' : 'c-fill', esc(hasL ? h.minus[i] : ''),
        kind === 'delete' ? gut() : '',
        hasR ? h.target.start + i : '', hasR ? 'c-del' + (acc ? ' struck' : '') : 'c-fill', esc(hasR ? blk[i] : ''));
    }
  }
  if (h.plus.length && kind !== 'delete') {
    h.plus.forEach((p, i) => {
      html += row('+', 'c-add', esc(p), gut(), acc ? '+' : '', acc ? 'c-add' : 'c-fill', acc ? esc(p) : '');
    });
  }
  return html;
}

function renderUnplaced(f, h) {
  let html = hunkHeader(f, h);
  const lines = [...h.minus.map(x => ['−', 'c-del', x]), ...h.plus.map(x => ['+', 'c-add', x])];
  html += `<div class="row" style="grid-template-rows:repeat(${Math.max(lines.length, 1)}, auto)">`;
  lines.forEach((l, i) => {
    html += `<div class="ln ${l[1]}" style="grid-column:1;grid-row:${i + 1}">${l[0]}</div><div class="code ${l[1]}" style="grid-column:2;grid-row:${i + 1}">${esc(l[2])}</div>`;
  });
  html += `<div class="gut" style="grid-column:3;grid-row:1 / span ${Math.max(lines.length, 1)}"></div>`;
  html += `<div class="noplace" style="grid-row:1 / span ${Math.max(lines.length, 1)}">Không xác định được vị trí ở FOMULAR. Cần sửa tay theo câu trả lời.</div></div>`;
  return html;
}

function renderDiff(f) {
  const items = layout(f);
  const near = new Array(items.length).fill(false);
  items.forEach((it, i) => { if (it.type === 'hunk') for (let k = Math.max(0, i - CTX); k <= Math.min(items.length - 1, i + CTX); k++) near[k] = true; });
  let html = `<div class="colhdr"><div></div><div>Diff (new) — feature TELINDY</div><div></div><div></div><div>FOMULAR — ${esc(f.path)}${f.target_missing ? ' (chưa có file, sẽ tạo mới)' : ''}</div></div>`;
  let i = 0;
  while (i < items.length) {
    const it = items[i];
    if (it.type === 'hunk') { html += renderHunk(f, it.h); i++; continue; }
    if (near[i] || state.expanded.has(`${f.path}:${it.tline}`)) {
      const t = esc(f.target_lines[it.tline - 1]);
      html += row('', 'dim', t, '', it.tline, 'ctx', t);
      i++; continue;
    }
    let j = i;
    while (j < items.length && items[j].type === 'line' && !near[j] && !state.expanded.has(`${f.path}:${items[j].tline}`)) j++;
    if (j - i < 3) {
      for (let k = i; k < j; k++) { const t = esc(f.target_lines[items[k].tline - 1]); html += row('', 'dim', t, '', items[k].tline, 'ctx', t); }
    } else {
      html += `<div class="row"><div class="gap" data-expand="${items[i].tline}-${items[j - 1].tline}">⋯ ${j - i} dòng không đổi (dòng ${items[i].tline}–${items[j - 1].tline}). Bấm để mở</div></div>`;
    }
    i = j;
  }
  if (!items.length) html += `<div class="empty">File Target rỗng.</div>`;
  const unplaced = f.hunks.filter(h => !h.target);
  if (unplaced.length) {
    html += `<div class="row"><div class="unplaced-title">Chưa xác định vị trí ở FOMULAR (${unplaced.length})</div></div>`;
    unplaced.forEach(h => { html += renderUnplaced(f, h); });
  }
  return html;
}

function renderResult(f) {
  const lines = applyFile(f, state.decisions[f.path]);
  let html = `<div class="colhdr"><div style="padding:6px 8px">Kết quả sau merge — ${esc(f.path)} (${lines.length} dòng; xanh = code feature đã lấy)</div></div>`;
  lines.forEach((l, i) => {
    const c = l.origin === 'feature' ? 'c-add' : '';
    html += `<div class="row"><div class="ln ${c}">${i + 1}</div><div class="code ${c}">${esc(l.text)}</div></div>`;
  });
  return html;
}

function renderBanners() {
  const pend = allPending();
  const f = curFile();
  const parts = [];
  if (state.confirmed) {
    parts.push(`<div class="banner ok">Đã xác nhận. <a data-dl="file">Tải file này</a><a data-dl="all">Tải tất cả file</a><a data-dl="decisions">Tải decisions.json</a>` +
      (VIEW.files.some(x => x.encoding !== 'utf-8') ? ' File tải từ trình duyệt là UTF-8. Để giữ encoding gốc, dùng <code>merge_ui.py apply</code> với decisions.json.' : '') + `</div>`);
  } else if (pend.length) {
    parts.push(`<div class="banner warn">Còn ${pend.length} mục chưa quyết định: ` +
      pend.map(p => `<a data-jump="${p.fi}|${esc(p.h.id)}">${esc(VIEW.files[p.fi].path.split('/').pop())} · ${esc(p.h.unit)}${p.h.hunk ? ' ' + esc(p.h.hunk) : ''}</a>`).join('') + `</div>`);
  }
  (f.issues || []).forEach(x => parts.push(`<div class="banner warn"><b>${esc(x.title)}</b> — ${esc(x.detail || '')}</div>`));
  $('banners').innerHTML = parts.join('');
}

function render() {
  const f = curFile();
  renderSidebar();
  $('fileTitle').textContent = f.path;
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  $('confirm').disabled = allPending().length > 0;
  $('confirm').title = allPending().length ? 'Còn mục chưa quyết định' : '';
  renderBanners();
  $('content').innerHTML = `<div class="view ${state.view === 'result' ? 'result' : ''}">${state.view === 'diff' ? renderDiff(f) : renderResult(f)}</div>`;
}

function setDecision(id, d) {
  const f = curFile();
  state.decisions[f.path][id] = d;
  state.confirmed = false;
  persist();
  render();
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function fileText(f) {
  const lines = applyFile(f, state.decisions[f.path]).map(l => l.text);
  return lines.join(f.eol) + (f.final_newline && lines.length ? f.eol : '');
}
function decisionsJson() {
  const files = {};
  for (const f of VIEW.files) files[f.path] = { decisions: state.decisions[f.path], answers: state.answers[f.path] };
  return JSON.stringify({ rt: VIEW.rt, signature: VIEW.signature, created: new Date().toISOString(), files }, null, 2);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-i],[data-act],[data-toggle],[data-expand],[data-jump],[data-dl],[data-v]');
  if (!t) return;
  if (t.dataset.i !== undefined && t.closest('#filelist')) { state.fileIdx = +t.dataset.i; render(); $('content').scrollIntoView(); return; }
  if (t.dataset.act) { setDecision(t.dataset.id, t.dataset.act); return; }
  if (t.dataset.toggle) { const d = state.decisions[curFile().path][t.dataset.toggle]; setDecision(t.dataset.toggle, d === 'accept' ? 'reject' : 'accept'); return; }
  if (t.dataset.expand) { const [a, b] = t.dataset.expand.split('-').map(Number); for (let k = a; k <= b; k++) state.expanded.add(`${curFile().path}:${k}`); render(); return; }
  if (t.dataset.jump) { const [fi, id] = t.dataset.jump.split('|'); jumpTo(+fi, id); return; }
  if (t.dataset.v) { state.view = t.dataset.v; render(); return; }
  if (t.dataset.dl) {
    const f = curFile();
    if (t.dataset.dl === 'file') download(f.path.split('/').pop(), fileText(f));
    if (t.dataset.dl === 'all') VIEW.files.forEach((x, i) => setTimeout(() => download(x.path.replace(/\//g, '__'), fileText(x)), i * 300));
    if (t.dataset.dl === 'decisions') download('decisions.json', decisionsJson());
  }
});
document.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.ans;
  if (!id) return;
  state.answers[curFile().path][id] = e.target.value;
  persist();
});
function jumpTo(fi, id) {
  state.fileIdx = fi; state.view = 'diff'; render();
  const el = document.getElementById(`h-${VIEW.files[fi].path}-${id}`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1500); }
}
$('nextPending').onclick = () => {
  const pend = allPending();
  if (!pend.length) { alert('Không còn mục nào cần xác nhận.'); return; }
  const after = pend.find(p => p.fi > state.fileIdx) || pend.find(p => p.fi === state.fileIdx) || pend[0];
  jumpTo(after.fi, after.h.id);
};
$('dlDecisions').onclick = () => download('decisions.json', decisionsJson());
$('confirm').onclick = () => {
  if (allPending().length) return;
  state.confirmed = true; state.view = 'result'; render();
};
document.title = `Merge Review ${VIEW.rt}`;
// Mở thẳng file / tab qua URL: #f=1&v=result
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.has('f')) state.fileIdx = Math.min(Math.max(0, +hp.get('f') || 0), VIEW.files.length - 1);
if (hp.get('v') === 'result') state.view = 'result';
render();
}
</script>
</body>
</html>
